<!-- popup.html -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tracking Snapshot</title>
  <style>
    :root {
      --bg: #0b0f14;
      --text: #e6edf6;
      --muted: #9db0c8;
      --border: #1f2a3a;
      --accent: #38bdf8;
      --good: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
      --radius: 14px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #070a0f 0%, var(--bg) 100%);
      color: var(--text);
      font-family: var(--font);
      width: 480px;
    }

    header {
      padding: 14px 14px 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .titleRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: .2px;
    }

    .pill {
      font-size: 12px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, .03);
      color: var(--muted);
      white-space: nowrap;
    }

    .sub {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    main {
      padding: 12px 14px 14px 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card {
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
      overflow: hidden;
    }

    .cardHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .cardHead h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--muted);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .03);
      flex: none;
    }

    .badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(255, 255, 255, .02);
      white-space: nowrap;
    }

    .kv {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
    }

    .kv b {
      color: var(--text);
      font-weight: 650;
    }

    /* General accordion behavior */
    details {
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    summary {
      list-style: none;
      cursor: pointer;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .chev {
      width: 10px;
      height: 10px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(-45deg);
      transition: transform .15s ease;
      flex: none;
    }

    summary .chev {
      transform: rotate(-45deg);
    }

    details[open]>summary .chev {
      transform: rotate(45deg);
    }

    .accBody {
      border-top: 1px solid var(--border);
      padding: 12px;
      background: rgba(0, 0, 0, .10);
    }

    .sentence {
      margin: 0 0 10px 0;
      font-size: 12.5px;
      line-height: 1.35;
      color: var(--text);
    }

    .sentence .muted {
      color: var(--muted);
    }

    /* Fingerprinting "card as accordion" */
    details.card {
      padding: 0;
      background: rgba(255, 255, 255, .03);
    }

    details.card>summary {
      padding: 12px;
      display: block;
    }

    details.card[open]>summary {
      border-bottom: 1px solid var(--border);
    }

    /* Nested details (Metrics boxes) */
    .miniDetails {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
      padding: 8px 10px;
      margin-top: 10px;
    }

    .miniDetails>summary {
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .miniTitle {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .miniBody {
      padding-top: 10px;
    }

    .list {
      display: grid;
      gap: 8px;
      font-size: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      /* important: prevent children from overflowing the card */
      min-width: 0;
    }

    .row .k {
      color: var(--muted);
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .row .v {
      flex: 1 1 auto;
      min-width: 0;
      /* CRITICAL in flex for ellipsis */
      text-align: right;

      /* default: truncate */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      font-variant-numeric: tabular-nums;
    }

    .sectionTitle {
      margin: 12px 0 8px 0;
      font-size: 12px;
      color: var(--muted);
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .state {
      padding: 10px 12px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255, 255, 255, .02);
    }

    .toggleBtn {
      width: 100%;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .02);
      color: var(--text);
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
    }

    .toggleBtn:hover {
      background: rgba(255, 255, 255, .04);
    }

    /* Script accordion cards */
    .scriptDetails {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .scriptDetails>summary {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .scriptDetails[open]>summary {
      border-bottom: 1px solid var(--border);
    }

    .scriptSummaryLeft {
      min-width: 0;
      flex: 1 1 auto;
    }

    .scriptName {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;

      white-space: normal;
      word-break: normal;
      overflow-wrap: break-word;
    }

    .scriptSub {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--muted);

      white-space: normal;
      overflow-wrap: normal;
      word-break: normal;
      line-height: 1.3;
    }

    .scriptRight {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }

    .scriptBody {
      padding: 10px;
      background: rgba(0, 0, 0, .10);
    }

    .score {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .02);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      align-self: center;
    }

    .score.good {
      border-color: rgba(34, 197, 94, .4);
      color: var(--good);
    }

    .score.warn {
      border-color: rgba(245, 158, 11, .4);
      color: var(--warn);
    }

    .score.bad {
      border-color: rgba(239, 68, 68, .4);
      color: var(--bad);
    }

    /* Spikes section */
    .spikeDetails {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
      overflow: hidden;
      margin-top: 8px;
    }

    .spikeDetails>summary {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .spikeLeft {
      min-width: 0;
      flex: 1 1 auto;
    }

    .spikeTitle {
      font-size: 12.5px;
      font-weight: 650;
      line-height: 1.35;
    }

    .spikeMeta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      white-space: normal;
      line-height: 1.3;
    }

    .spikeBody {
      padding: 10px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      background: rgba(0, 0, 0, .10);
    }

    /* Correlated HTTP list inside a spike */
    .httpList {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .httpItem {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;

      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
    }

    .httpLeft {
      min-width: 0;
      flex: 1 1 auto;
    }

    .httpTitle {
      font-size: 12.5px;
      font-weight: 650;
      line-height: 1.35;

      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .httpMeta {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.3;

      white-space: normal;
      overflow-wrap: normal;
      word-break: normal;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .fpEventList {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .fpEventItem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
    }

    .fpEventName {
      min-width: 0;
      font-size: 12.5px;
      font-weight: 650;
      line-height: 1.35;

      white-space: normal;
      overflow-wrap: normal;
      word-break: normal;
    }

    .fpEventCount {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .02);
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .fpTimeline {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .fpTimelineItem {
      display: flex;
      align-items: baseline;
      gap: 10px;

      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
    }

    .fpTime {
      flex: none;
      font-size: 11.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .fpArrow {
      flex: none;
      color: var(--muted);
    }

    .fpEvent {
      min-width: 0;
      font-size: 12.5px;
      font-weight: 650;
      line-height: 1.35;

      white-space: normal;
      overflow-wrap: normal;
      word-break: normal;
    }

    /* CNAME domain accordion */
    .cnameDomainDetails {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .cnameDomainDetails>summary {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .cnameDomainDetails[open]>summary {
      border-bottom: 1px solid var(--border);
    }

    .cnameLeft {
      min-width: 0;
      flex: 1 1 auto;
    }

    .cnameTitle {
      font-size: 12.5px;
      font-weight: 650;
      line-height: 1.35;

      white-space: normal;
      word-break: normal;
      overflow-wrap: break-word;

      max-width: 100%;
    }

    .cnameMeta {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.3;
    }

    /* CNAME request accordion */
    .cnameReqDetails {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
      overflow: hidden;
      margin-top: 8px;
    }

    .cnameReqDetails>summary {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .cnameReqDetails[open]>summary {
      border-bottom: 1px solid var(--border);
    }

    .cnameReqBody {
      padding: 10px;
      background: rgba(0, 0, 0, .10);
    }

    .cnameUrl {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", "Courier New", monospace;
      font-size: 12px;

      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .02);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      max-width: 100%;
    }

    /* DNS domain accordion */
    .dnsDomainDetails {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .dnsDomainDetails>summary {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .dnsDomainDetails[open]>summary {
      border-bottom: 1px solid var(--border);
    }

    .dnsLeft {
      min-width: 0;
      flex: 1 1 auto;
    }

    .dnsTitle {
      font-size: 12.5px;
      font-weight: 650;
      line-height: 1.35;

      white-space: normal;
      overflow-wrap: break-word;
      word-break: normal;
    }

    .dnsMeta {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.3;
    }

    /* DNS request accordion */
    .dnsReqDetails {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
      overflow: hidden;
      margin-top: 8px;
    }

    .dnsReqDetails>summary {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .dnsReqDetails[open]>summary {
      border-bottom: 1px solid var(--border);
    }

    .dnsReqBody {
      padding: 10px;
      background: rgba(0, 0, 0, .10);
    }

    /* Make request summary line truncate nicely */
    .dnsReqTitle {
      font-size: 12.5px;
      font-weight: 650;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <header>
    <div class="titleRow">
      <div class="title">Tracking Snapshot</div>
      <div class="pill" id="pillStatus">No data</div>
    </div>
    <div class="sub" id="pageUrl">—</div>
  </header>

  <main>
    <section class="grid" aria-label="Overview">

      <!-- Fingerprinting (single card + accordion) -->
      <details id="fpAccordion" class="card">
        <summary>
          <div class="cardHead" style="width:100%; margin:0;">
            <h3 style="margin:0;">
              <span class="dot" id="dotFp"></span> Fingerprinting
            </h3>

            <div style="display:flex; align-items:center; gap:8px;">
              <span class="badge" id="badgeFp">—</span>
              <div class="chev" aria-hidden="true"></div>
            </div>
          </div>

          <div class="kv" style="margin-top:8px;">
            <span><b id="fpIntensity">—</b> events</span>
            <span><b id="fpDuration">—</b> sec</span>
            <span><b id="fpApis">—</b> APIs</span>
            <span><b id="fpCats">—</b> categories</span>
          </div>
        </summary>

        <div class="accBody">
          <p class="sentence" id="fpSentence">—</p>

          <details class="miniDetails" id="fpMetricsDetails">
            <summary>
              <div class="miniTitle">Metrics</div>
              <div class="chev" aria-hidden="true"></div>
            </summary>
            <div class="miniBody">
              <div class="list" id="fpMetricsList"></div>
            </div>
          </details>

          <div class="sectionTitle">Scripts</div>
          <div id="scriptsList" aria-label="Fingerprinting scripts list"></div>

          <button id="scriptsToggleBtn" class="toggleBtn" style="display:none;" type="button">
            Show all scripts
          </button>
        </div>
      </details>

      <!-- CNAME cloaking (accordion) -->
      <details id="cnameAccordion" class="card">
        <summary>
          <div class="cardHead" style="width:100%; margin:0;">
            <h3 style="margin:0;">
              <span class="dot" id="dotCname"></span> CNAME cloaking
            </h3>

            <div style="display:flex; align-items:center; gap:8px;">
              <span class="badge" id="badgeCname">—</span>
              <div class="chev" aria-hidden="true"></div>
            </div>
          </div>

          <div class="kv" style="margin-top:8px;">
            <span><b id="cnameDomains">—</b> domains</span>
            <span><b id="cnameRequests">—</b> requests</span>
          </div>
        </summary>

        <div class="accBody">
          <div id="cnameDomainsList"></div>
        </div>
      </details>

      <!-- DNS tracking (accordion) -->
      <details id="dnsAccordion" class="card">
        <summary>
          <div class="cardHead" style="width:100%; margin:0;">
            <h3 style="margin:0;">
              <span class="dot" id="dotDns"></span> DNS tracking
            </h3>

            <div style="display:flex; align-items:center; gap:8px;">
              <span class="badge" id="badgeDns">—</span>
              <div class="chev" aria-hidden="true"></div>
            </div>
          </div>

          <div class="kv" style="margin-top:8px;">
            <span><b id="dnsDomains">—</b> domains</span>
            <span><b id="dnsRequests">—</b> requests</span>
          </div>
        </summary>

        <div class="accBody">
          <div id="dnsDomainsList"></div>
        </div>
      </details>

    </section>
  </main>

  <script src="popup.js"></script>
</body>

</html>
